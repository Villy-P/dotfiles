services:
  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - proxy
    ports:
      - "9466:3000"

networks:
  proxy:
    external: true

volumes:
  grafana_data:
