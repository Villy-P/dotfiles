services:
  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    user: 1000:1000
    volumes:
      - ./config:/config
      - ./cache:/cache
      - ./media:/media
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "987"
    restart: unless-stopped
    networks:
      - proxy

networks:
  proxy:
    external: true
