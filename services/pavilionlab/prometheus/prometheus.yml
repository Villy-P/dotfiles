global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node
    static_configs:
      - targets: ["precisionlab:9100"]
        labels:
          machine: precisionlab
      - targets: ["pavilionlab:9100"]
        labels:
          machine: pavilionlab
      - targets: ["elitebooklab:9100"]
        labels:
          machine: elitebooklab
      - targets: ["fireflylab:9100"]
       labels:
         machine: fireflylab
