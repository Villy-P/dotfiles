services:
  speedtest-tracker:
    image: lscr.io/linuxserver/speedtest-tracker:latest
    container_name: speedtest-tracker
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
      - APP_KEY=${SPEEDTEST_KEY}
      - DB_CONNECTION=sqlite
      - SPEEDTEST_SCHEDULE=0 */6 * * *
      - APP_URL=https://pavilionlab.tailc8658b.ts.net:8471
      - ASSET_URL=https://pavilionlab.tailc8658b.ts.net:8471
      - DB_DATABASE=/config/database.sqlite
    volumes:
      - ./config:/config
    ports:
      - "9471:80"
