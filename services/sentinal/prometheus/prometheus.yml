global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node
    static_configs:
      - targets: ["precisionlab:9100"]
        labels:
          machine: homelab
      - targets: ["sentinal:9100"]
        labels:
          machine: sentinal
      - targets: ["media:9100"]
        labels:
          machine: media
