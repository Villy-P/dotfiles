services:
  dozzle:
    container_name: dozzle
    image: amir20/dozzle:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - dozzle_data:/data
    ports:
      - "9457:8080"
    networks:
      - proxy
    environment:
      - DOZZLE_REMOTE_AGENT=atlas:7007

volumes:
  dozzle_data:

networks:
  proxy:
    external: true

